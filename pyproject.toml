[project]
name = "sandladanab"
version = "2.0.0"
description = "Sandlådan AB – Grävmaskinsjobb på västkusten"
requires-python = ">=3.12"
license = { text = "MIT" }

dependencies = [
    "fastapi>=0.141,<1.0",
    "uvicorn[standard]>=0.32",
    "gunicorn>=22",
    "jinja2>=3.1,<4.0",
    "python-multipart>=0.0.31",
    "httpx[http2]>=0.28",
    "python-dateutil>=2.9,<3.0",
    "icalendar>=6.1,<8.0",
    "aiofiles>=24.1",
    "pydantic-settings>=2.14.2",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.9",
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "httpx",
    "pillow>=11.2",
    "pyyaml>=6.0",
]

[project.scripts]
dev = "uvicorn main:app --reload --host 0.0.0.0 --port 8000"

[tool.uv]
# Floors for transitive packages with published advisories (pip-audit, 2026-09-21).
# uv can never resolve below these, whatever fastapi/httpx pin in the future.
constraint-dependencies = [
    "starlette>=1.3.1",
    "anyio>=4.14.2",
    "click>=8.3.3",
    "h2>=4.4.1",
    "idna>=3.15",
    "python-multipart>=0.0.31",
    "pydantic-settings>=2.14.2",
]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
# S = flake8-bandit security rules (ruff's built-in Bandit)
select = ["E", "F", "I", "UP", "B", "SIM", "RUF", "S"]
ignore = ["RUF001"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S105", "S106"] # asserts and fake credentials belong in tests
"scripts/*" = ["S101"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
testpaths = ["tests"]