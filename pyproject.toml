[project]
name = "sandladanab"
version = "1.0.0"
description = "Sandlådan AB – Grävmaskinsjobb på västkusten"
requires-python = ">=3.12"
license = { text = "MIT" }

dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.32",
    "gunicorn>=22",
    "jinja2>=3.1,<4.0",
    "python-multipart>=0.0.18",
    "httpx[http2]>=0.28",
    "python-dateutil>=2.9,<3.0",
    "icalendar>=6.1,<7.0",
    "aiofiles>=24.1",
    "pydantic-settings>=2.7",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.9",
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "httpx",
]

[project.scripts]
dev = "uvicorn main:app --reload --host 0.0.0.0 --port 8000"

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["RUF001"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"