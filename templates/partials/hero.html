<section class="hero">
  <img
    class="hero__bg"
    srcset="
      {{ url_for('static', path='assets/images/hero-excavator-640.webp') }} 640w,
      {{ url_for('static', path='assets/images/hero-excavator-1280.webp') }} 1280w,
      {{ url_for('static', path='assets/images/hero-excavator-1920.webp') }} 1920w"
    sizes="100vw"
    src="{{ url_for('static', path='assets/images/hero-excavator-1280.webp') }}"
    alt=""
    width="1920"
    height="1080"
    loading="eager"
    fetchpriority="high"
    decoding="async"
  />

  <div class="hero__overlay"></div>

  <div class="container hero__content">
    <h1>Anläggningsjobb när du behöver det – på västkusten.</h1>
    <p class="lead">Punktliga leveranser • Försäkrat arbete • Erfaren förare</p>
    <div class="stack">
      <a
        href="tel:{{ owner_phone }}"
        class="btn btn--primary header__cta btn--icon"
        aria-label="Ring direkt"
      >
        <svg
          xmlns="http://www.w3.org/2000/svg"
          viewBox="0 0 24 24"
          width="18"
          height="18"
          aria-hidden="true"
          focusable="false"
        >
          <path
            fill="currentColor"
            d="M6.62 10.79a15.05 15.05 0 006.59 6.59l2.2-2.2a1
      1 0 011.01-.24c1.12.37 2.33.57 3.58.57a1
      1 0 011 1V20a1 1 0 01-1 1C10.3 21
      3 13.7 3 4a1 1 0 011-1h3.5a1
      1 0 011 1c0 1.25.2 2.46.57 3.58a1
      1 0 01-.25 1.01l-2.2 2.2z"
          />
        </svg>
        <span>Ring direkt</span>
      </a>

      <a href="#offert" class="btn btn--ghost">Begär offert</a>
    </div>

    <div
      id="status"
      class="pill"
      hx-get="/status"
      hx-trigger="load, every 1h"
      hx-swap="innerHTML"
      aria-live="polite"
    >
      Laddar tillgänglighet…
    </div>
  </div>
</section>
