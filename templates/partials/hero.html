{% from "macros/icons.html" import icon_phone %}

<section class="hero">
  <img
    class="hero__bg"
    srcset="
      {{ url_for('static', path='assets/images/hero-excavator-640.webp') }} 640w,
      {{ url_for('static', path='assets/images/hero-excavator-1280.webp') }} 1280w,
      {{ url_for('static', path='assets/images/hero-excavator-1920.webp') }} 1920w"
    sizes="100vw"
    src="{{ url_for('static', path='assets/images/hero-excavator-1280.webp') }}"
    alt="Grävmaskin i solnedgång"
    width="1920"
    height="1080"
    loading="eager"
    fetchpriority="high"
    decoding="async"
  />

  <div class="hero__overlay"></div>

  <div class="container hero__content">
    <h1>Anläggningsjobb när du behöver det.</h1>
    <p class="lead">
      Punktliga leveranser • Försäkrat arbete • Erfaren förare
    </p>

    <div class="stack">
      <a
        href="tel:{{ owner_phone }}"
        class="btn btn--primary btn--icon"
        aria-label="Ring {{ owner_phone }}"
      >
        {{ icon_phone(20) }}
        <span>Ring direkt</span>
      </a>
      <a href="#offert" class="btn btn--ghost">Begär offert</a>
    </div>

    <!-- Status pill — HTMX loads content on page load -->
    <div
      id="status"
      class="pill"
      hx-get="/api/status"
      hx-trigger="load"
      hx-swap="innerHTML"
    >
      <span class="pill__inner">
        <span class="pill__dot" aria-hidden="true"></span>
        <span class="pill__text" style="opacity: 0.8">
          Kontrollerar tillgänglighet…
        </span>
      </span>
    </div>
  </div>
</section>
