{% from "macros/picture.html" import picture with context %}

<section class="section" id="galleri" aria-labelledby="galleri-h">
  <div class="wrap">
    <div class="section__head">
      <p class="eyebrow">Galleri</p>
      <h2 id="galleri-h" class="display-2">{{ copy.gallery_h2 }}</h2>
      <p class="lead">{{ copy.gallery_lead }}</p>
    </div>

    <ul class="gallery" role="list">
      {% for item in gallery_items %}
        <li class="gallery__item{% if item.slot != 'square' %} gallery__item--{{ item.slot }}{% endif %}">
          <figure class="gallery__figure">
            {{ picture(item, gallery_sizes[item.slot]) }}
          </figure>
          <p class="gallery__caption">{{ item.caption }}</p>
        </li>
      {% endfor %}
    </ul>
  </div>
</section>
