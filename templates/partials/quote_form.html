<section id="offert" class="section">
  <div class="container" style="max-width: 42rem">
    <div class="text-center" style="margin-bottom: 2rem">
      <h2 style="font-size: 2.25rem">Begär Offert</h2>
      <p class="muted">
        Beskriv ditt projekt så återkommer vi oftast samma dag.
      </p>
    </div>

    <form
      class="form"
      action="/api/offert"
      method="post"
      hx-post="/api/offert"
      hx-target="#form-response"
      hx-swap="innerHTML"
      hx-disabled-elt="find button[type='submit']"
      enctype="multipart/form-data"
    >
      <!-- Honeypot -->
      <div class="visually-hidden" aria-hidden="true">
        <label for="website">Lämna detta fält tomt</label>
        <input
          id="website"
          type="text"
          name="website"
          tabindex="-1"
          autocomplete="off"
        />
      </div>

      <div>
        <label class="form-label" for="namn">Namn *</label>
        <input
          class="form-input"
          id="namn"
          name="namn"
          required
          autocomplete="name"
          placeholder="Ditt för- och efternamn"
        />
      </div>

      <div>
        <label class="form-label" for="telefon">Telefon *</label>
        <input
          class="form-input"
          id="telefon"
          name="telefon"
          type="tel"
          required
          autocomplete="tel"
          inputmode="tel"
          placeholder="070 - 123 45 67"
        />
      </div>

      <div>
        <label class="form-label" for="beskrivning">
          Vad behöver du hjälp med?
        </label>
        <textarea
          class="form-input"
          id="beskrivning"
          name="beskrivning"
          rows="4"
          placeholder="Kort om projektet (t.ex. grävning för pool, dränering...)"
        ></textarea>
      </div>

      <div>
        <label class="form-label" for="bild">Bild (valfritt)</label>
        <input
          class="form-input"
          type="file"
          id="bild"
          name="bild"
          accept="image/*"
        />
      </div>

      <button type="submit" class="btn btn--primary" style="width: 100%">
        Skicka förfrågan
      </button>
    </form>

    <p class="help" style="margin-top: 0.75rem; text-align: center">
      Genom att skicka formuläret godkänner du att vi behandlar dina
      uppgifter för att kunna återkomma med offert. Inga uppgifter
      används i marknadsföringssyfte och delas inte med tredje part.
    </p>

    <div id="form-response" role="region" aria-live="polite" style="margin-top: 1rem"></div>
  </div>
</section>
