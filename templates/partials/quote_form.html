<section class="section" id="offert" aria-labelledby="offert-h">
  <div class="wrap">
    <div class="section__head">
      <p class="eyebrow">Begär offert</p>
      <h2 id="offert-h" class="display-2">{{ copy.offert_h2 }}</h2>
      <p class="lead">{{ copy.offert_lead }}</p>
    </div>

    {#- Posts with fetch (site.js) into #form-response; without JS it posts normally to the same endpoint. -#}
    <form
      class="form"
      action="/api/offert"
      method="post"
      enctype="multipart/form-data"
      data-async
      data-target="#form-response"
    >
      <!-- Honeypot -->
      <div class="visually-hidden" aria-hidden="true">
        <label for="website">Lämna detta fält tomt</label>
        <input id="website" type="text" name="website" tabindex="-1" autocomplete="off" />
      </div>

      <div class="field">
        <label class="form-label" for="namn">Namn <span class="req" aria-hidden="true">*</span></label>
        <input class="form-input" id="namn" name="namn" required autocomplete="name" placeholder="Ditt för- och efternamn" maxlength="120" />
      </div>

      <div class="field">
        <label class="form-label" for="telefon">Telefon <span class="req" aria-hidden="true">*</span></label>
        <input class="form-input" id="telefon" name="telefon" type="tel" required autocomplete="tel" inputmode="tel" placeholder="070-123 45 67" maxlength="40" />
      </div>

      <div class="field">
        <label class="form-label" for="beskrivning">Vad behöver du hjälp med?</label>
        <textarea class="form-input" id="beskrivning" name="beskrivning" rows="4" placeholder="Kort om projektet (t.ex. grävning för pool, dränering…)" maxlength="4000"></textarea>
      </div>

      <div class="field">
        <label class="form-label" for="bild">Bild (valfritt)</label>
        <input class="form-input" type="file" id="bild" name="bild" accept="image/jpeg,image/png,image/webp,image/avif" />
        <p class="help">JPEG, PNG, WebP eller AVIF. Max 10 MB.</p>
      </div>

      <button type="submit" class="btn btn--primary btn--block">Skicka förfrågan</button>

      <p class="help">
        {{ copy.consent }}
        <a href="/integritet">Så hanterar vi dina uppgifter.</a>
      </p>

      <div id="form-response" role="region" aria-live="polite" tabindex="-1"></div>
    </form>
  </div>
</section>
