<section
  id="offert"
  class="section"
  style="background: rgba(255, 255, 255, 0.02)"
>
  <div class="container" style="max-width: 42rem">
    <div class="text-center" style="margin-bottom: 2rem">
      <h2>Begär Offert</h2>
      <p>Beskriv ditt projekt så återkommer vi oftast samma dag.</p>
    </div>

    <form
      class="form"
      action="/offert"
      method="post"
      hx-post="/offert"
      hx-target="#form-response"
      hx-swap="innerHTML"
      enctype="multipart/form-data"
    >
      <!-- Honeypot -->
      <input
        type="text"
        name="website"
        class="visually-hidden"
        tabindex="-1"
        autocomplete="off"
      />

      <div>
        <label class="form-label" for="namn">Namn *</label>
        <input
          class="form-input"
          id="namn"
          name="namn"
          required
          autocomplete="name"
        />
      </div>

      <div>
        <label class="form-label" for="telefon">Telefon *</label>
        <input
          class="form-input"
          id="telefon"
          name="telefon"
          type="tel"
          required
          autocomplete="tel"
        />
      </div>

      <div>
        <label class="form-label" for="beskrivning"
          >Vad behöver du hjälp med?</label
        >
        <textarea
          class="form-input"
          id="beskrivning"
          name="beskrivning"
          rows="4"
        ></textarea>
      </div>

      <div>
        <label class="form-label" for="bild">Bild (Valfritt)</label>
        <input
          class="form-input"
          type="file"
          id="bild"
          name="bild"
          accept="image/*"
        />
      </div>

      <button type="submit" class="btn btn--primary" style="width: 100%">
        Skicka förfrågan
      </button>
    </form>
    <p class="help" style="margin-top: 0.75rem; text-align: center">
      Genom att skicka formuläret godkänner du att vi behandlar dina uppgifter
      för att kunna återkomma med offert. Inga uppgifter används i
      marknadsföringssyfte och delas inte med tredje part.
    </p>

    <div id="form-response" style="margin-top: 1rem"></div>
  </div>
</section>
