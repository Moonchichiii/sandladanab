<section class="section" aria-labelledby="tjanster">
  <div class="container">
    <h2 id="tjanster">Tjänster</h2>

    <ul class="cards" role="list">
      {% for s in services %}
        <li class="card">
          <h3>{{ s.title }}</h3>
          <p class="muted">{{ s.description }}</p>
        </li>
      {% endfor %}
    </ul>
  </div>
</section>
