<section class="section" id="tjanster" aria-labelledby="tjanster-h">
  <div class="wrap">
    <div class="section__head">
      <p class="eyebrow">Tjänster</p>
      <h2 id="tjanster-h" class="display-2">{{ copy.services_h2 }}</h2>
    </div>

    <ul class="services" role="list">
      {% for s in services %}
        <li class="service">
          <h3 class="service__title">{{ s.title }}</h3>
          <p class="service__desc">{{ s.description }}</p>
        </li>
      {% endfor %}
    </ul>
  </div>
</section>
