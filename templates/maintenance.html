<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sandlådan AB – Kommer snart</title>
    <meta name="robots" content="noindex, nofollow">
    <style>
        body {
            background-color: #0E1113;
            color: #ffffff;
            font-family: system-ui, -apple-system, sans-serif;
            height: 100vh;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 1rem;
        }
        img {
            max-width: 100%;
            height: auto;
            max-height: 70vh; /* Keeps image from being too tall */
            border-radius: 8px;
            margin-bottom: 2rem;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
        }
        h1 {
            font-size: clamp(1.5rem, 5vw, 2.5rem);
            margin: 0 0 1rem;
            line-height: 1.2;
        }
        p {
            font-size: 1.125rem;
            color: #adb5bd; /* Muted gray */
            margin: 0;
        }
    </style>
</head>
<body>
    <div>
        <img src="/static/images/maintenance.avif" alt="Under arbete">

        <h1>Sidan är under rekonstruktion</h1>
        <p>Vi återkommer strax!</p>
    </div>
</body>
</html>
