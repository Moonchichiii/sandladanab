<!DOCTYPE html>
<html lang="sv" class="h-full">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>
      {% block title %}Sandlådan AB – Grävmaskinsjobb på västkusten{% endblock
      %}
    </title>
    <meta
      name="description"
      content="Sandlådan AB utför grävmaskinsjobb på konsultbasis i Göteborg med omnejd. Snabb offert och punktlig leverans."
    />
    <link rel="stylesheet" href="{{ url_for('static', path='styles.css') }}" />
    <link
      rel="icon"
      href="{{ url_for('static', path='assets/favicon.svg') }}"
      type="image/svg+xml"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="{{ url_for('static', path='assets/favicon-32x32.png') }}"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="16x16"
      href="{{ url_for('static', path='assets/favicon-16x16.png') }}"
    />
    <link
      rel="icon"
      href="{{ url_for('static', path='assets/favicon.ico') }}"
      sizes="any"
    />

    <meta name="theme-color" content="#0E1113" />
    <!-- matches your asphalt bg -->
    <meta name="application-name" content="Sandlådan AB" />
    <meta name="apple-mobile-web-app-title" content="Sandlådan AB" />

    <script
      src="{{ url_for('static', path='vendor/htmx.min.js') }}"
      defer
    ></script>
    <script src="{{ url_for('static', path='file-input.js') }}" defer></script>
  </head>
  <body class="min-h-full">
    <a id="top" tabindex="-1"></a>
    <a href="#main" class="sr-skip">Hoppa till innehåll</a>

    {% include "partials/header.html" %} {% block hero %}{% endblock %}

    <main id="main" class="container" style="padding: 3rem 0">
      {% block content %}{% endblock %}
    </main>

    {% include "partials/footer.html" %}
  </body>
</html>
